<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Wiki</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h2>Pages</h2>
    <input id="search" type="search" placeholder="Search…">
    <ul id="search-results"></ul>
    <label>Tag <select id="tag-filter"><option value="">(all)</option></select></label>
    <label>Sort <select id="sort"><option value="title">Title</option><option value="updated">Updated</option></select></label>
    <ul id="page-list"></ul>
    <button id="new-page">New page</button>
  </aside>
  <main id="main">
    <div id="toolbar">
      <input id="slug" placeholder="slug">
      <input id="title" placeholder="Title">
      <input id="tags" placeholder="tags, comma separated">
      <button id="save">Save</button>
      <button id="delete">Delete</button>
      <button id="show-history">History</button>
      <span id="status"></span>
    </div>
    <div id="conflict" hidden>
      This page was changed elsewhere (current version <span id="conflict-version"></span>).
      <button id="conflict-reload">Load latest (discard mine)</button>
      <button id="conflict-overwrite">Overwrite with mine</button>
    </div>
    <div id="editor-wrap">
      <textarea id="editor" spellcheck="false" placeholder="Write Markdown here. Use [[Page Title]] for wiki links."></textarea>
      <article id="preview" class="markdown-body"></article>
    </div>
    <section id="history" hidden>
      <h3>History</h3>
      <ul id="history-list"></ul>
      <pre id="diff"></pre>
    </section>
    <section id="backlinks-panel">
      <h3>Backlinks</h3>
      <ul id="backlinks"></ul>
    </section>
  </main>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
