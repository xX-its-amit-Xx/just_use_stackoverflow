<!doctype html>
<html><head><meta charset="utf-8"><title>Kanban</title>
<style>
body{font-family:sans-serif;margin:0;background:#f3f4f6}header{background:#2563eb;color:#fff;padding:8px 16px;display:flex;justify-content:space-between}
main{padding:16px}.cols{display:flex;gap:12px;align-items:flex-start;overflow-x:auto}.col{background:#e5e7eb;border-radius:6px;padding:8px;min-width:240px}
.card{background:#fff;border-radius:4px;padding:6px;margin:6px 0;box-shadow:0 1px 2px #0003}.err{color:#b91c1c}input,button{margin:2px}
</style></head><body>
<header><b>Kanban</b><span id="who"></span></header><main id="app"></main>
<script>
let token=localStorage.getItem('token'),boardId=null;
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(m,p,b){const r=await fetch('/api'+p,{method:m,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:b?JSON.stringify(b):undefined});
 if(r.status===204)return null;const j=await r.json();if(!r.ok)throw new Error(j.message||j.error);return j;}
function authView(msg){$('#who').textContent='';app.innerHTML=`<h2>Login / Register</h2><div class="err">${esc(msg||'')}</div>
<input id="u" placeholder="username"><input id="p" type="password" placeholder="password"><input id="d" placeholder="display name (register)">
<button id="li">Login</button><button id="rg">Register</button>`;
 const creds=()=>({username:$('#u').value,password:$('#p').value});
 $('#li').onclick=async()=>{try{const r=await api('POST','/auth/login',creds());token=r.token;localStorage.setItem('token',token);boardsView();}catch(e){authView(e.message)}};
 $('#rg').onclick=async()=>{try{const c=creds();if($('#d').value)c.displayName=$('#d').value;await api('POST','/auth/register',c);const r=await api('POST','/auth/login',creds());token=r.token;localStorage.setItem('token',token);boardsView();}catch(e){authView(e.message)}};}
async function boardsView(){try{const me=await api('GET','/auth/me');$('#who').innerHTML=esc(me.user.displayName)+' <button id="lo">Logout</button>';
 $('#lo').onclick=async()=>{await api('POST','/auth/logout');token=null;localStorage.removeItem('token');authView();};
 const bs=await api('GET','/boards');app.innerHTML=`<h2>Boards</h2><ul>${bs.map(b=>`<li><a href="#" data-id="${esc(b.id)}">${esc(b.name)}</a> (${esc(b.role)})</li>`).join('')}</ul>
 <input id="bn" placeholder="new board name"><button id="bc">Create board</button>`;
 app.querySelectorAll('a[data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();boardView(a.dataset.id)});
 $('#bc').onclick=async()=>{try{await api('POST','/boards',{name:$('#bn').value});boardsView();}catch(e){alert(e.message)}};
}catch(e){token=null;localStorage.removeItem('token');authView(e.message)}}
async function boardView(id){boardId=id;try{const b=await api('GET','/boards/'+id);
 app.innerHTML=`<button id="back">&larr; Boards</button><h2>${esc(b.name)}</h2><div class="cols">${b.columns.map(c=>`<div class="col" data-col="${esc(c.id)}"><b>${esc(c.name)}</b>${c.wipLimit?' (limit '+c.wipLimit+')':''}
 ${c.cards.map(k=>`<div class="card" draggable="true" data-card="${esc(k.id)}">${esc(k.title)}<br>${b.columns.filter(o=>o.id!==c.id).map(o=>`<button data-mv="${esc(k.id)}" data-to="${esc(o.id)}">&rarr; ${esc(o.name)}</button>`).join('')}</div>`).join('')}
 <div><input placeholder="new card" data-new="${esc(c.id)}"><button data-add="${esc(c.id)}">Add</button></div></div>`).join('')}</div>`;
 $('#back').onclick=boardsView;
 const act=async f=>{try{await f();}catch(e){alert(e.message)}boardView(id)};
 app.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>act(()=>api('POST','/columns/'+x.dataset.add+'/cards',{title:app.querySelector(`[data-new="${x.dataset.add}"]`).value})));
 app.querySelectorAll('[data-mv]').forEach(x=>x.onclick=()=>act(()=>api('POST','/cards/'+x.dataset.mv+'/move',{columnId:x.dataset.to})));
 app.querySelectorAll('.card').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.card));
 app.querySelectorAll('.col').forEach(c=>{c.ondragover=e=>e.preventDefault();c.ondrop=e=>{e.preventDefault();const cid=e.dataTransfer.getData('text/plain');act(()=>api('POST','/cards/'+cid+'/move',{columnId:c.dataset.col}))}});
}catch(e){alert(e.message);boardsView()}}
token?boardsView():authView();
</script></body></html>
