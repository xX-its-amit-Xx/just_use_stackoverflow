<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>diagram-s5</title>
<link rel="stylesheet" href="/static/style.css"></head>
<body>
<div id="auth"><h2>diagram-s5</h2>
  <input id="user" placeholder="username"><input id="pass" type="password" placeholder="password">
  <button id="login">Login</button><button id="register">Register</button><div id="autherr"></div></div>
<div id="docs" hidden><h3>Documents</h3><button id="newdoc">New document</button><ul id="doclist"></ul></div>
<div id="app" hidden>
  <div id="toolbar">
    <button data-tool="select" title="Select">Select</button><button data-tool="rect">Rect</button><button data-tool="ellipse">Ellipse</button>
    <button data-tool="diamond">Diamond</button><button data-tool="text">Text</button><button data-tool="line">Line</button><button data-tool="connector">Connector</button>
    <span class="sep"></span>
    <button id="undo">Undo</button><button id="redo">Redo</button><button id="del">Delete</button>
    <span class="sep"></span>
    <button data-align="left">⇤</button><button data-align="center">↔</button><button data-align="right">⇥</button>
    <button data-align="top">⇡</button><button data-align="middle">↕</button><button data-align="bottom">⇣</button>
    <button data-dist="horizontal">Dist H</button><button data-dist="vertical">Dist V</button>
    <select id="layout"><option value="">Auto-layout…</option><option value="layered-TB">Layered TB</option><option value="layered-LR">Layered LR</option><option value="grid">Grid</option></select>
    <select id="routing"><option value="straight">Straight</option><option value="orthogonal">Orthogonal</option></select>
    <span class="sep"></span>
    <button id="importbtn">Import draw.io</button><input id="importfile" type="file" hidden>
    <button id="expsvg">Export SVG</button><button id="expjson">Export JSON</button>
    <button id="zoomin">+</button><button id="zoomout">−</button><span id="status"></span>
  </div>
  <div id="main">
    <svg id="canvas" tabindex="0"><g id="vp"><g id="content"></g><g id="overlay"></g></g></svg>
    <svg id="minimap"></svg>
    <div id="side">
      <div id="props"><h4>Properties</h4>
        <label>Fill <input id="p-fill" type="color" value="#ffffff"></label>
        <label>Stroke <input id="p-stroke" type="color" value="#000000"></label>
        <label>Width <input id="p-sw" type="number" min="0" max="20" value="1"></label>
        <label>Font <input id="p-fs" type="number" min="6" max="96" value="14"></label>
        <label>Opacity <input id="p-op" type="range" min="0" max="1" step="0.05" value="1"></label>
        <label>Text <input id="p-text"></label></div>
      <div id="layers"><h4>Layers</h4><ul id="layerlist"></ul><button id="addlayer">Add layer</button></div>
      <div id="versions"><h4>Versions</h4><button id="savever">Save version</button><ul id="verlist"></ul></div>
      <div id="comments"><h4>Comments</h4><input id="ctext" placeholder="comment on selection"><button id="addcomment">Add</button><ul id="clist"></ul></div>
      <div id="people"><h4>Collaborators</h4><ul id="plist"></ul></div>
    </div>
  </div>
</div>
<script type="module" src="/static/app.js"></script>
</body></html>
