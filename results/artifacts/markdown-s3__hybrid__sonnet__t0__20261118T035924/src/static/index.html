<!doctype html>
<html><head><meta charset="utf-8"><title>Markdown Wiki</title>
<style>body{font-family:sans-serif;margin:0;display:flex;height:100vh}#side{width:260px;border-right:1px solid #ccc;padding:8px;overflow:auto}#main{flex:1;padding:8px;overflow:auto}textarea{width:100%;height:240px;font-family:monospace}#preview{border:1px solid #ddd;padding:8px;margin-top:8px}.add{background:#dfd}.del{background:#fdd}pre{margin:0}</style></head>
<body>
<div id="side"><input id="search" placeholder="Search"><select id="tagfilter"><option value="">all tags</option></select><button id="new">New</button><ul id="list"></ul></div>
<div id="main">
<input id="slug" placeholder="slug"> <input id="title" placeholder="Title"> <input id="tags" placeholder="tags, comma separated">
<button id="save">Save</button> <span id="status"></span>
<textarea id="body"></textarea>
<div id="preview"></div>
<h3>Backlinks</h3><ul id="backlinks"></ul>
<h3>History</h3><ul id="history"></ul><pre id="diff"></pre>
</div>
<script src="/static/app.js" type="module"></script>
</body></html>
