<!doctype html>
<html><head><meta charset="utf-8"><title>Markdown Wiki</title>
<style>
body{font-family:sans-serif;margin:0;display:flex;height:100vh}
#side{width:250px;border-right:1px solid #ccc;padding:8px;overflow:auto}
#main{flex:1;display:flex;flex-direction:column;padding:8px;overflow:auto}
#panes{display:flex;gap:8px;flex:1;min-height:250px}
#panes>*{flex:1;border:1px solid #ccc;padding:6px;overflow:auto}
textarea{font-family:monospace}
.wikilink.missing{color:#c00}
.add{background:#dfd}.del{background:#fdd}
pre{margin:0}
</style></head>
<body>
<div id="side">
  <input id="search" placeholder="Search…"><div id="results"></div>
  <p>Tag: <select id="tagfilter"><option value="">(all)</option></select></p>
  <button id="new">New page</button>
  <ul id="list"></ul>
</div>
<div id="main">
  <div><input id="slug" placeholder="slug"> <input id="title" placeholder="Title" size="40"> <input id="tags" placeholder="tags, comma separated">
  <button id="save">Save</button> <span id="status"></span></div>
  <div id="panes"><textarea id="body"></textarea><div id="preview"></div></div>
  <div><b>Backlinks:</b> <span id="backlinks"></span></div>
  <details><summary>History</summary><ul id="history"></ul><pre id="diff"></pre></details>
</div>
<script src="/static/app.js" type="module"></script>
</body></html>
